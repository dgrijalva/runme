[package]
name = "rnme-macros"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Proc macros for rnme — the #[rnme::task] attribute and cmd! macro"
repository = "https://github.com/dgrijalva/runme"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
zyn = "0.5.4"
