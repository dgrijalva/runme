[package]
name = "runme"
version = "0.1.0"
edition = "2024"

[dependencies]
runme-macros = { path = "../runme-macros" }
inventory = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.29", features = ["signal", "process"] }
regex = "1"
bytes = "1"
winnow = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
