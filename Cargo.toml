[package]
name = "rnme"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A Rust-native task runner — tasks are plain Rust in RUNME.rs files"
keywords = ["task-runner", "build-tool", "command-line"]
categories = ["command-line-utilities", "development-tools"]

[workspace]
resolver = "3"
members = ["macros", "testing/test-tasks"]

[[bin]]
name = "runme"
path = "src/bin/rnme/main.rs"

[dependencies]
rnme-macros = { path = "macros" }
inventory = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.29", features = ["signal", "process"] }
regex = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
winnow = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry", "env-filter"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio-stream = { version = "0.1", features = ["sync"] }
base64 = "0.22"
fuzzy-matcher = "0.3"
notify = "7"
globset = "0.4"
clap = { version = "4", features = ["derive"] }
itertools = "0.14.0"
futures = "0.3.32"
humantime = "2"
shell-words = "1"
# CLI-only deps
ignore = "0.4"
sha2 = "0.10"
exec = "0.3"
rmcp = { version = "1.6.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
rnme-test-tasks = { path = "testing/test-tasks" }
tempfile = "3"
serde_json = "1"
